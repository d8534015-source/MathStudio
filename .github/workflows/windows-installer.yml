name: Windows teacher installer
on:
  pull_request:
    branches: ['codex/delivery-v4166', 'codex/argos-offline-v4166', 'codex/teacher-website-management-v4166', 'codex/classroom-recording-pen-v4166', 'codex/recording-resources-policies-v4166', 'codex/recording-stop-native-input-v4166']
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'release_manifest.json'
      - 'packaging/windows/**'
      - '.github/workflows/windows-installer.yml'
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.12'
          architecture: x64
      - name: Install hash-locked test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Focused native input and shutdown regressions
        timeout-minutes: 2
        run: python -m unittest test_native_input_shutdown test_responsive_toolbar -v
      - name: Full regression suite (UTF-8)
        id: regression
        timeout-minutes: 15
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force work/windows-build/installer | Out-Null
          python -X faulthandler -c "import faulthandler,unittest,sys; faulthandler.dump_traceback_later(90,repeat=True); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('.')); sys.exit(not result.wasSuccessful())" 2>&1 | Tee-Object -FilePath work/windows-build/installer/windows-regression.log
          exit $LASTEXITCODE
      - name: Chinese codepage regressions
        timeout-minutes: 2
        run: |
          $env:PYTHONUTF8='0'
          chcp 936
          python -m unittest test_windows_startup -v
      - name: Build bundled client and single-file installer
        run: python packaging/windows/build.py --review
      - name: Test owned Windows tunnel job cleanup
        run: python packaging/windows/check_owner_cleanup.py
      - name: Install, launch without Python on PATH, uninstall, reinstall
        timeout-minutes: 3
        run: ./packaging/windows/smoke.ps1 -Review
      - name: Inspect Authenticode and scan with Defender when available
        run: ./packaging/windows/verify_distribution.ps1
      - name: Record Windows regression outcome
        if: always()
        run: |
          New-Item -ItemType Directory -Force work/windows-build/installer | Out-Null
          '${{ steps.regression.outcome }}' | Set-Content work/windows-build/installer/windows-regression-outcome.txt
      - name: Preserve installer and evidence for review (no release publication)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MathStudio-Windows-installer
          path: work/windows-build/installer/*
          if-no-files-found: warn
          retention-days: 14
      - name: Require complete Windows regression success
        if: always() && steps.regression.outcome != 'success'
        run: throw 'Windows regression suite did not pass. Inspect windows-regression.log; installer artifacts remain review candidates only.'
