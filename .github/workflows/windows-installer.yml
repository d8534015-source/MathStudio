name: Windows teacher installer
on:
  pull_request:
    branches: ['codex/delivery-v4166']
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'release_manifest.json'
      - 'packaging/windows/**'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.12'
          architecture: x64
      - name: Install hash-locked test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Full regression suite (UTF-8)
        run: python -m unittest discover -v
      - name: Chinese codepage regressions
        run: |
          $env:PYTHONUTF8='0'
          chcp 936
          python -m unittest test_windows_startup -v
      - name: Build bundled client and single-file installer
        run: python packaging/windows/build.py
      - name: Install, launch without Python on PATH, uninstall, reinstall
        run: ./packaging/windows/smoke.ps1
      - name: Preserve installer and evidence for review (no release publication)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MathStudio-Windows-installer
          path: work/windows-build/installer/*
          if-no-files-found: warn
          retention-days: 14
